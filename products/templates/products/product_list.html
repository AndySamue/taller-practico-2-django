{% extends "base.html" %}

{% block content %}
<div class="container-fluid text-center">
    <h1>Lista de Productos</h1>
    <a href="{% url 'product_create' %}" class="btn btn-primary m-3" >Crear Producto</a>
    <div class="d-flex flex-wrap justify-content-center gap-5">
        {% for product in products %}
            <div class="card" style="width: 18rem;">
                <img
                    src="{{ product.image }}"
                    class="card-img-top img-fluid p-3"
                    alt="{{ product.title }}"
                    style="height: 200px; width: fit-content; margin: auto;">

                <div class="card-body d-flex flex-column justify-content-between">
                    <h5 class="card-title">{{product.title}}</h5>
                    <p class="card-text text-truncate">{{product.description}}</p>
                    <h5 class="card-text">{{ product.price}}</h5>
                    <a href="{% url 'product_detail' product.id %}" class="btn btn-primary" >Ver Detalles</a>
                    <a href="{% url 'product_update' product.id %}" class="btn btn-primary mb-3" >Editar</a>
                    <a href="{% url 'product_delete' product.id %}" class="btn btn-primary mb-3" >Eliminar</a>
                </div>
            </div>
        {% endfor %}
    </div>
</div>

{% endblock %}
