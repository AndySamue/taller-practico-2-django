{% extends "base.html" %}

{% load django_bootstrap5 %}

{% block title %} Iniciar sesion {% endblock %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-md-4">
        <div class="pokedex-card">
            <h1 class="text-center mb-4">Iniciar sesion</h1>
            <form method="POST">
                {% csrf_token %}
                {% bootstrap_form form %}
                {% if next %}
                    <input type="hidden" name="next" value="{{ next }}">
                {% endif %}
                <button type="submit" class="btn-pokedex w-100 mt-2">Entrar</button>
            </form>
        </div>
    </div>
</div>

{% endblock %}
