{% extends "base.html" %}

{% block content %}
<div class="container-fluid text-center">
    <h1>Pokedex</h1>
    <a href="{% url 'pokemon_create' %}" class="btn btn-primary m-3" >Agregar Pokemon</a>
    <div class="d-flex flex-wrap justify-content-center gap-5">
        {% for pokemon in pokemons %}
            <div class="card" style="width: 18rem;">
                <img
                    src="{{ pokemon.image }}"
                    class="card-img-top img-fluid p-3"
                    alt="{{ pokemon.name }}"
                    style="height: 200px; width: fit-content; margin: auto;">

                <div class="card-body d-flex flex-column justify-content-between">
                    <h5 class="card-title text-capitalize">{{ pokemon.name }}</h5>
                    <p class="card-text">
                        {% for type in pokemon.types.all %}
                            <span class="badge bg-secondary">{{ type.name }}</span>
                        {% endfor %}
                    </p>
                    <a href="{% url 'pokemon_detail' pokemon.id %}" class="btn btn-primary" >Ver Detalles</a>
                    <a href="{% url 'pokemon_update' pokemon.id %}" class="btn btn-primary mb-3" >Editar</a>
                    <a href="{% url 'pokemon_delete' pokemon.id %}" class="btn btn-primary mb-3" >Eliminar</a>
                </div>
            </div>
        {% endfor %}
    </div>
</div>

{% endblock %}
