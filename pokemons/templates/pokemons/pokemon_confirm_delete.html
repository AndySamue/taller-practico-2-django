{% extends "base.html" %}

{% block title %} Eliminar {{ pokemon.name }} {% endblock %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="pokedex-card">
            <h1 class="h3 mb-4">Eliminar Pokemon</h1>
            <div class="pokemon-card-image-wrap">
                <img src="{{ pokemon.image }}" class="img-fluid" alt="{{ pokemon.name }}">
            </div>
            <p>
                ¿Seguro que deseas eliminar a
                <strong class="text-capitalize">{{ pokemon.name }}</strong>?
                Esta accion no se puede deshacer.
            </p>
            <form method="POST" class="d-flex justify-content-center gap-2 flex-wrap">
                {% csrf_token %}
                <button type="submit" class="btn-pokedex">Si, eliminar</button>
                <a href="{% url 'pokemon_detail' pokemon.id %}" class="btn-pokedex-outline">Cancelar</a>
            </form>
        </div>
    </div>
</div>

{% endblock %}
